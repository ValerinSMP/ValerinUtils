debug: true

crimson-protection:
  enabled: true
  worlds:
    - world_crimson
  allowed-break-ids:
    - crimson_ore
  deny-place: true
  bypass-permission: valerinutils.crimsonprotection.bypass

messages:
  # Paleta ValerinUtils: primario #FFD166, éxito #00FB9A,
  # error #FF3300 y advertencia #FFC43B.
  aesthetic-theme-enabled: true
  help-style-version: 3
  prefix: '<dark_gray>[<#FFD166>ᴠᴀʟᴇʀɪɴ</#FFD166><dark_gray>]</dark_gray> '
  no-permission: '%prefix%<red>No tienes permiso para usar este comando.'
  only-players: '%prefix%<red>Solo jugadores pueden usar este comando.'
  unknown-subcommand: "<#FF3300>Subcomando desconocido: <white>'%input%'</white>. Usa <#FFD166>/valerinutils help</#FFD166>."
  valerinutils-usage: '%prefix%<gray>Uso: <yellow>/valerinutilsadmin reload [all|modulo]'
  valerinutils-reload-ok: '%prefix%<green>Configuracion y modulos recargados correctamente.'
  valerinutils-reload-module-ok: '%prefix%<green>Modulo <yellow>%module% <green>recargado correctamente.'
  valerinutils-reload-module-disabled: '%prefix%<yellow>Modulo <gold>%module% <yellow>recargado y dejado desactivado por config.'
  valerinutils-reload-unknown: '%prefix%<red>Modulo desconocido: <yellow>%module%<red>.'
  valerinutils-reload-config-missing: '%prefix%<red>No se pudo recargar la config de <yellow>%module%<red>.'

  # Ayuda estilo vChat/William278: dos columnas, hover, click, espacios y páginas.
  help:
    entries-per-page: 9
    header: "<newline><#FFD166><bold>ValerinUtils</bold></#FFD166> <#FFD166>| Comandos:</#FFD166> <gray>(%page%/%pages%)</gray><newline>"
    invalid-page: "<#FF3300>Página inválida. Usa <white>/valerinutils help <1-%pages%></white>."
    footer: " "
    entries:
      - command: "/menuitem <on|off|toggle>"
        description: "Gestionar el ítem del menú"
        suggest: "/menuitem "
      - command: "/code <código>"
        description: "Reclamar un código"
        suggest: "/code "
      - command: "/grace check"
        description: "Consultar tu inmunidad PvP"
        suggest: "/grace check"
      - command: "/craft"
        description: "Abrir una mesa de trabajo"
        suggest: "/craft"
      - command: "/anvil"
        description: "Abrir un yunque"
        suggest: "/anvil"
      - command: "/smithingtable"
        description: "Abrir una mesa de herrería"
        suggest: "/smithingtable"
      - command: "/cartographytable"
        description: "Abrir una mesa de cartografía"
        suggest: "/cartographytable"
      - command: "/grindstone"
        description: "Abrir una piedra de afilar"
        suggest: "/grindstone"
      - command: "/loom"
        description: "Abrir un telar"
        suggest: "/loom"
      - command: "/stonecutter"
        description: "Abrir un cortapiedras"
        suggest: "/stonecutter"
      - command: "/disposal"
        description: "Abrir el basurero"
        suggest: "/disposal"
      - command: "/hat"
        description: "Usar el ítem de tu mano como sombrero"
        suggest: "/hat"
      - command: "/condense"
        description: "Condensar materiales en bloques"
        suggest: "/condense"
      - command: "/seen <jugador>"
        description: "Consultar la última conexión"
        suggest: "/seen "
      - command: "/ping [jugador]"
        description: "Consultar la latencia"
        suggest: "/ping "
      - command: "/fly [jugador]"
        description: "Activar o desactivar el vuelo"
        suggest: "/fly "
      - command: "/speed <1-10> [jugador]"
        description: "Cambiar velocidad de vuelo o caminata"
        suggest: "/speed "
      - command: "/heal [jugador]"
        description: "Restaurar la vida"
        suggest: "/heal "
      - command: "/feed [jugador]"
        description: "Restaurar el hambre"
        suggest: "/feed "
      - command: "/repair hand"
        description: "Reparar el objeto de tu mano"
        suggest: "/repair hand"
      - command: "/nick <apodo|off>"
        description: "Cambiar o retirar tu apodo"
        suggest: "/nick "
      - command: "/skull [jugador]"
        description: "Obtener la cabeza de un jugador"
        suggest: "/skull "
      - command: "/suicide"
        description: "Reaparecer voluntariamente"
        suggest: "/suicide"
      - command: "/near [radio]"
        description: "Ver jugadores cercanos"
        suggest: "/near "
      - command: "/ptime <day|night|reset>"
        description: "Cambiar tu tiempo personal"
        suggest: "/ptime "
      - command: "/pweather <clear|rain|reset>"
        description: "Cambiar tu clima personal"
        suggest: "/pweather "
      - command: "/sell <hand|inventory>"
        description: "Vender objetos mediante ExcellentEconomy"
        suggest: "/sell "
      - command: "/vtop"
        description: "Teletransportarte a la superficie"
        suggest: "/vtop"
      - command: "/sign <texto>"
        description: "Firmar el objeto de tu mano"
        suggest: "/sign "
      - command: "/itemsign remove"
        description: "Quitar una firma"
        suggest: "/itemsign remove"
      - command: "/helpop <mensaje>"
        description: "Enviar un mensaje al staff"
        suggest: "/helpop "
      - command: "/clear [jugador]"
        description: "Limpiar un inventario"
        suggest: "/clear "
      - command: "/gmc"
        description: "Cambiar a modo creativo"
        suggest: "/gmc"
      - command: "/gms"
        description: "Cambiar a modo supervivencia"
        suggest: "/gms"
      - command: "/gmsp"
        description: "Cambiar a modo espectador"
        suggest: "/gmsp"
      - command: "/gma"
        description: "Cambiar a modo aventura"
        suggest: "/gma"
      - command: "/broadcast <mensaje>"
        description: "Enviar un anuncio global"
        suggest: "/broadcast "
      - command: "/voucher give <jugador> <tipo>"
        description: "Entregar un voucher"
        suggest: "/voucher give "
        permission: "valerinutils.admin"
      - command: "/valerinutils about"
        description: "Información del plugin"
        suggest: "/valerinutils about"
      - command: "/vutilsadmin reload"
        description: "Recargar configuración y módulos"
        suggest: "/vutilsadmin reload "
        permission: "valerinutils.admin"
      - command: "/vutilsadmin debug"
        description: "Controlar el diagnóstico"
        suggest: "/vutilsadmin debug "
        permission: "valerinutils.admin"
      - command: "/vutilsadmin deathspawn"
        description: "Configurar respawns por región"
        suggest: "/vutilsadmin deathspawn "
        permission: "valerinutils.admin"

database:
  # sqlite is the only optimized option for now
  type: sqlite
