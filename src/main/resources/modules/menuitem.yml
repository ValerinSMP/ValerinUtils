enabled: true
slot: 8
material: PAPER
name: '<aqua>Menú del Aventurero <gray>(Click Derecho)'
lore:
- '<gray>Accede al menú del aventurero'
- '<gray>para habilidades, gestión de protes,'
- '<gray>warps, config ¡y más!'
- ''
- '<yellow>¡Click para abrir!'
command: dm open menu %player%
# Se ejecuta la primera regla cuya condicion coincida. Si ninguna coincide,
# se usa "command". Operadores: equals, not_equals, contains, not_contains,
# regex, truthy, falsy, resolved y unresolved.
command-rules:
  - condition:
      placeholder: "%koth_active%"
      operator: truthy
      value: ""
    command: "dm open menu-koth %player%"
custom-model-data: 3

disabled-worlds: []

sound:
  enabled: true
  name: BLOCK_CHEST_OPEN
  volume: 1.0
  pitch: 1.0

cooldown-seconds: 3

messages:
  usage: "%prefix%<gray>Usa <#FFD166>/menuitem</#FFD166> para ver los comandos."
  on: "%prefix%<#00FB9A>Ítem de menú activado.</#00FB9A>"
  off: "%prefix%<#00FB9A>Ítem de menú desactivado.</#00FB9A>"
  toggled-on: "%prefix%<#00FB9A>Ítem de menú activado.</#00FB9A>"
  toggled-off: "%prefix%<#00FB9A>Ítem de menú desactivado.</#00FB9A>"
  slot-occupied: "%prefix%<#FF3300>El slot está ocupado; vacíalo antes de activar el ítem de menú.</#FF3300>"
  cooldown: "%prefix%<#FF3300>Espera <white>%time%s</white> antes de volver a usarlo.</#FF3300>"
