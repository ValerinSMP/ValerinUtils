enabled: true

# Spawn settings
spawn:
  # Teleport en primer ingreso al servidor
  first-join:
    enabled: false
    location: "world_lobby;-4;141;107;0;0"
    delay-ticks: 1

  # Forzar respawn en una ubicación
  on-death:
    enabled: false
    location: "world_lobby;-4;141;107;0;0"

# Mensajes del sistema / Comandos
messages:
  no_permission:
    module:
      chat:
        enabled: true
        message:
          - "<dark_gray>[<color:#FF6961>ᴍᴜᴇʀᴛᴇs<dark_gray>] <red>No tienes permisos."
      actionbar:
        enabled: false
        message:
          - ""
      title:
        enabled: false
        message:
          - ""
      subtitle:
        enabled: false
        message:
          - ""

  reload_success:
    module:
      chat:
        enabled: true
        message:
          - "<dark_gray>[<color:#FF6961>ᴍᴜᴇʀᴛᴇs<dark_gray>] <green>Configuración recargada."
      actionbar:
        enabled: false
        message:
          - ""
      title:
        enabled: false
        message:
          - ""
      subtitle:
        enabled: false
        message:
          - ""

