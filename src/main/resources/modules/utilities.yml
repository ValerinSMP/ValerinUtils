enabled: true

# Configuración de comandos individuales
commands:
  # Mesas
  craft:
    enabled: true
  anvil:
    enabled: true
  smithing:
    enabled: true
  cartography:
    enabled: true
  grindstone:
    enabled: true
  loom:
    enabled: true
  stonecutter:
    enabled: true
  disposal:
    enabled: true

  # Comandos Existentes
  hat:
    enabled: true
  condense:
    enabled: true
  seen:
    enabled: true
    others-enabled: true
  gamemode:
    enabled: true
  clear:
    enabled: true
    others-enabled: true
  ping:
    enabled: true
    others-enabled: true

  # Comandos de utilidad
  fly:
    enabled: true
    others-enabled: true
  speed:
    enabled: true
    others-enabled: true
  broadcast:
    enabled: true
  helpop:
    enabled: true
    cooldown-seconds: 20
    send-to-console: true
  heal:
    enabled: true  # Cambiar a false para deshabilitar completamente /heal
    others-enabled: true
    cooldown-seconds: 60
  feed:
    enabled: true
    others-enabled: true
  repair:
    enabled: true  # Cambiar a false para deshabilitar completamente /fix
    cooldown-seconds: 60
  nick:
    enabled: true
    min-length: 3
  skull:
    enabled: true
  suicide:
    enabled: true
  near:
    enabled: true
  top:
    enabled: true
  ptime:
    enabled: true
  pweather:
    enabled: true
  sell:
    enabled: true  # Cambiar a false para deshabilitar completamente /sell (si tienes tu propio sistema)

# Sonidos estéticos para las acciones
sounds:
  craft: "BLOCK_CHEST_OPEN"
  enderchest: "BLOCK_ENDER_CHEST_OPEN"
  anvil: "BLOCK_ANVIL_USE"
  smithing: "BLOCK_SMITHING_TABLE_USE"
  cartography: "UI_CARTOGRAPHY_TABLE_TAKE_RESULT"
  grindstone: "BLOCK_GRINDSTONE_USE"
  loom: "UI_LOOM_TAKE_RESULT"
  stonecutter: "UI_STONECUTTER_TAKE_RESULT"
  disposal: "BLOCK_BARREL_OPEN"
  hat-equip: "ITEM_ARMOR_EQUIP_GENERIC"
  condense: "BLOCK_ANVIL_USE"
  clear-inv: "ENTITY_ITEM_PICKUP"
  gamemode-change: "BLOCK_NOTE_BLOCK_CHIME"
  heal: "ENTITY_PLAYER_LEVELUP"
  broadcast: "BLOCK_NOTE_BLOCK_PLING"
  helpop-send: "UI_BUTTON_CLICK"
  helpop-receive: "BLOCK_NOTE_BLOCK_CHIME"

messages:
  no-permission: "%prefix%<red>No tienes permiso para usar este comando."
  only-players: "%prefix%<red>Solo jugadores pueden usar este comando."
  module-disabled: "%prefix%<red>Este comando está deshabilitado."
  player-not-found: "%prefix%<red>Jugador no encontrado."
  disposal-title: "<dark_gray>Basurero"
  
  # Mensajes de comandos
  hat-success: "%prefix%<green>¡Nuevo sombrero equipado!"
  clear-success: "%prefix%<green>Inventario de <white>%player% <green>limpiado."
  clear-success-self: "%prefix%<green>Tu inventario ha sido limpiado."
  condense-success: "%prefix%<#00FB9A>Se condensaron <white>%count%</white> objetos."
  condense-nothing: "%prefix%<#FFC43B>No hay objetos que condensar."
  gamemode-success: "%prefix%<green>Modo de juego cambiado a <yellow>%mode%<green>."
  ping-self: "%prefix%<gray>Tu ping es de: <yellow>%ping%ms"
  ping-other: "%prefix%<gray>El ping de <white>%player% <gray>es de: <yellow>%ping%ms"
  
  # Vuelo y Velocidad
  fly-enabled: "%prefix%<gray>Modo vuelo: <green>Activado"
  fly-disabled: "%prefix%<gray>Modo vuelo: <red>Desactivado"
  fly-others: "%prefix%<gray>Modo vuelo de <white>%player%<gray>: <yellow>%state%"
  speed-invalid: "%prefix%<red>La velocidad debe estar entre 1 y 10."
  speed-usage: "%prefix%<gray>Usa <#FFD166>/speed (1-10) [jugador]</#FFD166>."
  speed-success: "%prefix%<gray>Tu velocidad de <yellow>%type% <gray>ha sido ajustada a <green>%speed%<gray>."
  speed-others: "%prefix%<gray>Velocidad de <yellow>%type% <gray>de <white>%player% <gray>ajustada a <green>%speed%<gray>."

  # Salud y Alimentación
  heal-success: "%prefix%<#00FB9A>Has recuperado toda tu vida."
  heal-others: "%prefix%<#00FB9A>Has curado a <white>%player%</white>."
  feed-success: "%prefix%<#00FB9A>Has recuperado toda tu hambre."
  feed-others: "%prefix%<#00FB9A>Has alimentado a <white>%player%</white>."
  
  # Otros
  broadcast-usage: "%prefix%<gray>Usa <#FFD166>/broadcast (mensaje)</#FFD166>."
  broadcast-format:
    - ' '
    - '{center}<#FFD166><bold>🔔 ANUNCIO IMPORTANTE 🔔</bold></#FFD166>'
    - '{center}<white>%message%'
    - ' '
  helpop-usage: "%prefix%<gray>Usa <#FFD166>/helpop (mensaje)</#FFD166>."
  helpop-sent: "%prefix%<green>Tu reporte fue enviado al staff <gray>(<white>%staff%<gray>)."
  helpop-no-staff: "%prefix%<yellow>No hay staff conectado ahora. Tu mensaje fue enviado a consola."
  helpop-cooldown: "%prefix%<red>Espera <yellow>%time%s <red>antes de volver a usar /helpop."
  helpop-received: "<dark_gray>[<red>ʜᴇʟᴘᴏᴘ<dark_gray>] <white>%player% <gray>» <white>%message%"
  repair-success: "%prefix%<#00FB9A>Objeto reparado correctamente."
  repair-usage: "%prefix%<gray>Usa <#FFD166>/fix hand</#FFD166>."
  repair-error: "%prefix%<#FF3300>Este objeto no se puede reparar."
  heal-cooldown: "%prefix%<red>Espera <yellow>%time%s <red>antes de volver a usar /heal."
  repair-cooldown: "%prefix%<red>Espera <yellow>%time%s <red>antes de volver a usar /fix."
  nick-usage: "%prefix%<gray>Usa <#FFD166>/nick (apodo|off)</#FFD166>."
  nick-usage-others: "%prefix%<gray>Usa <#FFD166>/nick (jugador) (apodo|off)</#FFD166>."
  nick-format-not-allowed: "%prefix%<#FF3300>Formato no permitido. <gray>Nivel: <white>%tier%</white> • %allowed%</gray>"
  nick-success: "%prefix%<#00FB9A>Tu apodo ahora es <white>%nick%</white>."
  nick-off: "%prefix%<#00FB9A>Apodo desactivado."
  nick-off-others: "%prefix%<gray>Has quitado el apodo de <white>%player%<gray>."
  skull-success: "%prefix%<green>Has recibido la cabeza de <white>%player%<green>."
  suicide-msg: "%prefix%<gray>Has decidido terminar con todo..."
  top-success: "%prefix%<#00FB9A>Teletransportado a la superficie."
  ptime-usage: "%prefix%<gray>Usa <#FFD166>/ptime (day|night|reset)</#FFD166>."
  ptime-set: "%prefix%<green>Tiempo personal cambiado a <yellow>%value%<green>."
  ptime-reset: "%prefix%<green>Tiempo personal reseteado."
  pweather-usage: "%prefix%<gray>Usa <#FFD166>/pweather (clear|rain|reset)</#FFD166>."
  pweather-set: "%prefix%<green>Clima personal cambiado a <yellow>%value%<green>."
  pweather-reset: "%prefix%<green>Clima personal reseteado."
  sell-usage: "%prefix%<gray>Usa <#FFD166>/sell (hand|inventory)</#FFD166>."
  sell-disabled: "%prefix%<red>El sistema de venta está deshabilitado."
  sell-economy-missing: "%prefix%<#FF3300>No se detectó una economía mediante Vault."
  sell-nothing: "%prefix%<#FFC43B>No tienes objetos vendibles."
  sell-success: "%prefix%<#00FB9A>Vendiste <white>%items%</white> objetos por <#FFD166>$%amount%</#FFD166>."
  sell-enchanted: "%prefix%<#FF3300>No puedes vender objetos encantados."
  sell-damaged: "%prefix%<#FF3300>Los objetos deben estar en perfecto estado."
  sell-custom: "%prefix%<#FF3300>No puedes vender objetos personalizados."
  near-format: "%prefix%<gray>Jugadores cercanos: <white>%players%</white>"
  near-none: "%prefix%<#FFC43B>No hay jugadores cerca."

  # SEEN
  seen-format:
    - ""
    - "<#FFD166><bold>Información de %player%</bold></#FFD166>"
    - ""
    - "<gray>Estado: <white>%status%</white>"
    - "<gray>UUID: <white>%uuid%</white>"
    - "<gray>Ingreso: <white>%first_join%</white>"
    - "<gray>Última sesión: <white>%last_seen%</white>"
    - "<gray>Mundo: <white>%world%</white> <dark_gray>(%x%, %y%, %z%)</dark_gray>"
    - "<gray>Vida: <white>%health%</white> • Hambre: <white>%hunger%</white>"
    - "<gray>XP: <white>%xp%</white> • Modo: <white>%gamemode%</white> • Vuelo: <white>%fly%</white>"
    - ""
  seen-online: "<#00FB9A>Online"
  seen-offline: "<gray>Offline hace <white>%time%</white>"
  seen-usage: "%prefix%<gray>Usa <#FFD166>/seen (jugador)</#FFD166>."
